name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-feature:
    runs-on: ubuntu-24.04
    env:
      CI_ARTIFACT_DIR: .container-test-artifacts/ci-${{ github.run_id }}-${{ github.run_attempt }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-a-pr' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sh scripts/ci-container.sh full
      - name: Upload environment metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-environment
          path: |
            ${{ env.CI_ARTIFACT_DIR }}/test-inventory-reports/run-metadata.txt
            ${{ env.CI_ARTIFACT_DIR }}/test-inventory-reports/container-environment.txt
            ${{ env.CI_ARTIFACT_DIR }}/test-inventory-reports/browsers.txt
          if-no-files-found: warn
          include-hidden-files: true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: ${{ env.CI_ARTIFACT_DIR }}/coverage/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-report
          path: ${{ env.CI_ARTIFACT_DIR }}/test-inventory-reports/vitest.json
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: ${{ env.CI_ARTIFACT_DIR }}/test-inventory-reports/playwright.json
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-artifacts
          path: ${{ env.CI_ARTIFACT_DIR }}/test-results/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ${{ env.CI_ARTIFACT_DIR }}/dist/
          if-no-files-found: ignore
          include-hidden-files: true
  failure-artifact-probe:
    runs-on: ubuntu-24.04
    env:
      CI_ARTIFACT_DIR: .container-test-artifacts/probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run intentionally failing test
        id: probe
        continue-on-error: true
        run: sh scripts/ci-container.sh probe
      - name: Upload Playwright failure artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-probe
          path: ${{ env.CI_ARTIFACT_DIR }}/test-results/
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify probe outcome and attachment
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          test "$PROBE_OUTCOME" = failure
          test "$UPLOAD_OUTCOME" = success
          find "$CI_ARTIFACT_DIR/test-results" -type f -name 'intentional-failure-*.json' | grep -q .
