name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-full:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            check: macos-full
          - os: windows-2025
            check: windows-full
    env:
      CI: true
      HUSKY: 0
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-a-pr' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Record checkout and environment
        run: node scripts/ciEnvironment.js
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install chromium webkit
      - name: Record Playwright browser versions
        run: node scripts/ciBrowserVersions.js
      - name: Run complete feature verification
        run: npm run verify:feature
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.check }}-reports
          path: |
            .container-test-artifacts/native-metadata/
            test-inventory-reports/
            coverage/
            test-results/
          if-no-files-found: warn
          include-hidden-files: true
  linux-smoke:
    runs-on: ubuntu-24.04
    env:
      CI_ARTIFACT_DIR: .container-test-artifacts/ci-${{ github.run_id }}-${{ github.run_attempt }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-a-pr' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sh scripts/ci-container.sh smoke
      - name: Upload environment and smoke reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-smoke-reports
          path: |
            ${{ env.CI_ARTIFACT_DIR }}/test-inventory-reports/
            ${{ env.CI_ARTIFACT_DIR }}/test-results/
          if-no-files-found: warn
          include-hidden-files: true
